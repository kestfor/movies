services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: movies-frontend
    ports:
      - "3000:80"
    depends_on:
      - api

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: movies-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://movies:movies@postgres:5432/movies?sslmode=disable
      BOT_TOKEN: dev-bot-token
      AUTH_TTL: 24h
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
      HTTP_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: movies-postgres
    environment:
      POSTGRES_DB: movies
      POSTGRES_USER: movies
      POSTGRES_PASSWORD: movies
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movies -d movies"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
