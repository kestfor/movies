x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB:-movies}
  POSTGRES_USER: ${POSTGRES_USER:-movies}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movies}

x-database-url: &database-url postgres://${POSTGRES_USER:-movies}:${POSTGRES_PASSWORD:-movies}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-movies}?sslmode=disable

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: movies-frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: movies-api
    env_file:
      - .env
    environment:
      DATABASE_URL: *database-url
      BOT_TOKEN: ${TG_BOT_TOKEN:-}
      AUTH_TTL: 1h
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
      HTTP_PORT: 8080
    restart: on-failure
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backup-bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: movies-backup-bot
    command: [ "/app/backupbot" ]
    env_file:
      - .env
    environment:
      DATABASE_URL: *database-url
      BOT_TOKEN: ${TG_BOT_TOKEN:-}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_SCHEDULE_ENABLED: ${BACKUP_SCHEDULE_ENABLED:-true}
      BACKUP_ADMIN_CHAT_IDS: ${BACKUP_ADMIN_CHAT_IDS:-}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-03:00}
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-Asia/Krasnoyarsk}
      BACKUP_DATABASE_URL: *database-url
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: movies-migrate
    environment:
      DATABASE_URL: *database-url
    command: [ "/app/tern", "migrate", "--conn-string", *database-url, "--migrations", "/app/migrations" ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17-alpine
    container_name: movies-postgres
    environment:
      <<: *db-env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U movies -d movies" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
